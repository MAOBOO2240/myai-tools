<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 轉蛋模擬器</title>
    <style>
        /* === 數值與顏色全域變數 === */
        /* 用於更改背景、面板顏色、文字顏色以及按鈕的預設顏色 */
        :root {
            --bg-start: #1A1C31;
            --bg-end: #10101B;
            --panel-bg: #23253A;
            --input-bg: #151625;
            --text-main: #F0F0F0;
            --text-muted: #888B9E;
            --border-color: #31334A;
            --btn-blue: #738ADB;
            --btn-red: #FF6B6B;
            --btn-green: #66BB6A;
        }

        body.light-mode {
            --bg-start: #F5F5F5;
            --bg-end: #E0E0E0;
            --panel-bg: #FFFFFF;
            --input-bg: #F0F0F0;
            --text-main: #111111;
            --text-muted: #666666;
            --border-color: #CCCCCC;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            font-size: var(--font-size, 16px);
            background: linear-gradient(to bottom left, var(--bg-start), var(--bg-end)) fixed;
            overflow-y: auto; 
            transition: all 0.3s ease;
        }

        body.text-small { --font-size: 14px; }
        body.text-medium { --font-size: 16px; }
        body.text-large { --font-size: 20px; }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-start); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555577; }

        button {
            border: none;
            border-radius: 15px; /* G2連續曲率風格 */
            padding: 10px 15px;
            cursor: pointer;
            font-size: inherit;
            color: #FFFFFF;
            font-weight: bold;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            user-select: none;
        }
        button:hover { filter: brightness(1.1); transform: translateY(-1px); }
        button:active { transform: translateY(1px); }

        input, textarea {
            border-radius: 12px;
            padding: 10px 12px;
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            font-size: inherit;
            outline: none;
        }
        input:focus, textarea:focus { border-color: var(--btn-blue); }
        
        .list-input {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 6px 10px;
            color: var(--text-main);
            width: 100%;
            box-sizing: border-box;
            transition: 0.2s;
            outline: none;
        }
        .list-input:focus {
            border-color: var(--btn-blue);
            background-color: rgba(115, 138, 219, 0.1);
            box-shadow: 0 0 5px rgba(115, 138, 219, 0.3);
        }
        body.light-mode .list-input:focus { background-color: #FFF; }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background-color: transparent;
            z-index: 10;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 0 25px 25px 25px;
            flex: 1;
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 20px; /* G2連續曲率風格 */
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            height: max-content; 
        }

        /* 儲存活動區塊 */
        .activity-bar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 0 25px 20px 25px;
        }
        .activity-actions {
            display: flex;
            gap: 20px;
            justify-content: center; /* 置中放置 */
        }
        .activity-actions button {
            min-width: 180px; /* 按鈕寬度+1/3 (原本約130px) */
            padding: 10px 25px;
        }
        .activity-selectors {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .btn-activity {
            background-color: var(--input-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            white-space: nowrap;
        }
        /* 選擇性按鈕顏色區分 */
        .btn-activity.selected {
            background-color: var(--btn-blue);
            color: #FFFFFF;
            border-color: var(--btn-blue);
            box-shadow: 0 0 10px rgba(115, 138, 219, 0.5);
        }

        /* 解析區塊 */
        .collapsible-header {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-muted);
            padding: 10px 0;
            user-select: none;
        }
        .collapsible-header:hover { color: var(--text-main); }
        .collapsible-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        /* 道具排版 */
        .setup-labels, .setup-inputs {
            display: grid;
            grid-template-columns: 4fr 1fr 1fr;
            gap: 10px;
        }
        .setup-labels { color: var(--text-muted); font-size: 0.9em; margin-bottom: 5px; font-weight: bold; }
        .setup-inputs { margin-bottom: 15px; }
        .setup-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .setup-list-header {
            display: grid;
            grid-template-columns: 4fr 1fr 1fr 45px;
            gap: 10px;
            color: var(--text-muted);
            font-size: 0.9em;
            font-weight: bold;
            border-bottom: 2px solid var(--btn-blue);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .setup-item {
            display: grid;
            grid-template-columns: 4fr 1fr 1fr 45px;
            gap: 10px;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
        }
        
        .inv-grid {
            display: grid;
            grid-template-columns: 2.5fr 1fr 1fr 1.5fr;
            gap: 10px;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .inv-header { color: var(--text-muted); font-size: 0.9em; font-weight: bold; }

        .btn-add { background-color: var(--btn-blue); }
        .btn-reset { background-color: var(--btn-red); }
        .btn-green { background-color: var(--btn-green); }
        .btn-option { background-color: var(--border-color); flex: 1; }
        .btn-option.selected {
            background-color: var(--btn-blue);
            box-shadow: 0 0 10px rgba(115, 138, 219, 0.5);
        }
        
        /* 自動帶入按鈕的樣式 */
        .btn-autofill-on { background-color: var(--btn-green) !important; color: #FFF; }
        .btn-autofill-off { background-color: var(--btn-red) !important; color: #FFF; }

        .action-btn {
            background-color: var(--btn-red);
            border-radius: 10px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .stat-card {
            background-color: var(--input-bg);
            border-radius: 15px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: center;
            align-items: center;
        }
        .stat-label { font-size: 0.85em; color: var(--text-muted); display: flex; align-items: center; gap: 5px; width: 100%; justify-content: center;}
        .stat-value { font-size: 1.2em; font-weight: bold; }
        .text-green { color: #4CAF50; }
        .text-red { color: #EF5350; }
        .text-blue { color: #4DA8DA; }

        .ai-comment {
            background-color: rgba(115, 138, 219, 0.15);
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
            border: 1px solid rgba(115, 138, 219, 0.3);
        }
        .ai-expected {
            font-size: 1.1em;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 8px;
            border-bottom: 1px dashed rgba(255,215,0,0.3);
            padding-bottom: 8px;
        }
        .ai-review-text {
            color: #A8C7FA;
            font-weight: bold;
            font-size: 0.95em;
        }
        body.light-mode .ai-expected { color: #D97706; border-color: rgba(217, 119, 6, 0.3); }
        body.light-mode .ai-review-text { color: #1967D2; }

        /* 通用彈窗與對話框樣式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: var(--panel-bg);
            padding: 25px;
            border-radius: 20px;
            min-width: 320px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .modal-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }

        /* 是/否 按鈕規則: 是(左) #A8C7FA, 否(右) #FF0033 */
        .btn-yes { background-color: #A8C7FA !important; color: #000000 !important; flex: 1; }
        .btn-no { background-color: #FF0033 !important; color: #FFFFFF !important; flex: 1; }
    </style>
</head>
<body class="text-medium">

    <div class="top-bar">
        <div>
            <h2 style="margin:0; display: flex; align-items: center; gap: 10px;">
                <span style="color: #738ADB;">🎮</span> 轉蛋模擬器
            </h2>
        </div>
        <button style="background:none; font-size:24px; padding:0; color: var(--text-muted);" onclick="toggleSettings()">⚙️</button>
    </div>

    <!-- 儲存活動功能區塊 -->
    <div class="panel activity-bar">
        <div class="activity-actions">
            <button class="btn-add" onclick="promptAddActivity()">➕ 新增活動</button>
            <button class="btn-reset" onclick="promptDeleteActivity()">🗑️ 刪除活動</button>
        </div>
        
        <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between;">
            <div style="flex: 1; min-width: 200px;">
                <div style="color:var(--text-muted); font-size:0.9em; margin-bottom:8px; font-weight:bold;">📁 當前抽獎活動</div>
                <div id="activityButtons" class="activity-selectors">
                    <!-- 活動按鈕動態產生於此 -->
                </div>
            </div>
            
            <div style="display:flex; flex-direction:column; gap:8px;">
                <div style="color:var(--text-muted); font-size:0.9em; font-weight:bold;">💰 每一抽成本 (元)</div>
                <div style="display:flex; align-items:center; gap: 15px; background: rgba(35, 37, 58, 0.4); padding: 5px 15px; border-radius: 15px; border: 1px solid var(--border-color);">
                    <input type="number" id="costPerDraw" min="0" style="width: 80px; text-align: center;" onchange="handleCostChange()">
                    <!-- 自動帶入按鈕 -->
                    <button id="btnAutoFill" class="btn-autofill-off" onclick="toggleAutoFill()" style="padding: 6px 15px; font-size: 0.9em;">自動帶入價格 ❌</button>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <!-- 左半部：獎池設定 -->
        <div class="panel">
            <h3 style="margin: 0 0 10px 0; display: flex; align-items: center; gap: 8px;">
                📄 獎池道具
            </h3>
            
            <div>
                <div class="collapsible-header" onclick="toggleParseSection()" id="parseHeader">
                    ▼ 智慧文字解析
                </div>
                <div class="collapsible-body" id="parseBody" style="max-height: 200px;">
                    <textarea id="inputText" style="height: 60px; resize: none;" placeholder="請貼上網頁機率文字..."></textarea>
                    <button class="btn-add" style="width: 100%;" onclick="parseItems()">🔍 解析內容</button>
                </div>
            </div>

            <div style="height: 1px; background-color: var(--border-color); margin: 15px 0;"></div>

            <div class="setup-labels">
                <span>道具名稱</span>
                <span>機率(%)</span>
                <span>價值</span>
            </div>
            <div class="setup-inputs">
                <input type="text" id="manualName" placeholder="名稱">
                <input type="number" id="manualProb" placeholder="0.0" step="0.1">
                <input type="number" id="manualValue" placeholder="0">
            </div>
            <div class="setup-actions">
                <button class="btn-add" onclick="addManualItem()">➕ 新增</button>
                <button class="btn-reset" onclick="promptClearItems()">🗑️ 重製</button>
            </div>

            <div class="setup-list-header">
                <span>道具名稱</span>
                <span>機率(%)</span>
                <span>價值</span>
                <span style="text-align: center;">操作</span>
            </div>
            
            <div id="setupList"></div>
        </div>

        <!-- 右半部：抽獎模擬 -->
        <div class="panel">
            <h3 style="margin: 0 0 15px 0; display: flex; align-items: center; gap: 8px;">
                🎯 抽獎模擬 (按住按鈕可連續抽取)
            </h3>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn-green" style="flex: 1;" 
                        onmousedown="startDraw(1)" onmouseup="stopDraw()" onmouseleave="stopDraw()" 
                        ontouchstart="startDraw(1)" ontouchend="stopDraw()">單抽</button>
                <button class="btn-green" style="flex: 1;" 
                        onmousedown="startDraw(10)" onmouseup="stopDraw()" onmouseleave="stopDraw()" 
                        ontouchstart="startDraw(10)" ontouchend="stopDraw()">💎 10抽</button>
                <button class="btn-green" style="flex: 1;" 
                        onmousedown="startDraw(100)" onmouseup="stopDraw()" onmouseleave="stopDraw()" 
                        ontouchstart="startDraw(100)" ontouchend="stopDraw()">💎 100抽</button>
                <button class="btn-green" style="flex: 1;" 
                        onmousedown="startDraw(1000)" onmouseup="stopDraw()" onmouseleave="stopDraw()" 
                        ontouchstart="startDraw(1000)" ontouchend="stopDraw()">💎 1000抽</button>
                <button class="btn-reset" onclick="resetSim()" style="padding: 10px;">🔄 重置</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">💸 花費</span>
                    <span class="stat-value text-green" id="statCost">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">💎 價值</span>
                    <span class="stat-value text-blue" id="statValue">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">⚖️ 損益</span>
                    <span class="stat-value" id="statProfit">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">🎲 總抽數</span>
                    <span class="stat-value" id="statDraws">0</span>
                </div>
            </div>

            <h4 style="margin: 5px 0; color: var(--text-muted); display: flex; align-items: center; gap: 8px;">
                🎒 獲得道具清單
            </h4>
            <div class="inv-grid inv-header">
                <span>名稱</span>
                <span>數量</span>
                <span>總價值</span>
                <span>實際機率(%)</span>
            </div>
            <div id="inventoryList"></div>

            <div class="ai-comment">
                <div class="ai-expected" id="aiExpected">🤖 期望回報：等待數據</div>
                <div class="ai-review-text" id="aiReviewText">AI評論：等待分析中...</div>
            </div>
        </div>
    </div>

    <!-- 系統設定視窗 -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top: 0;">⚙️ 系統設定</h3>
            
            <div style="margin-bottom:8px; color: var(--text-muted); text-align: left;">🎨 面板顏色設定</div>
            <div class="modal-row">
                <input type="color" id="panelColor" value="#23253A" onchange="changePanelColor(this.value)" style="flex: 1; height: 40px; cursor: pointer; padding: 0; border: none; border-radius: 12px;">
                <button class="btn-add" onclick="resetPanelColor()" style="flex: 1;">🔄 恢復預設</button>
            </div>

            <div style="margin-bottom:8px; color: var(--text-muted); text-align: left;">🌓 顯示模式</div>
            <div class="modal-row">
                <button id="btn-dark" class="btn-option selected" onclick="setTheme('dark')">🌙 深色</button>
                <button id="btn-light" class="btn-option" onclick="setTheme('light')">☀️ 淺色</button>
            </div>

            <div style="margin-bottom:8px; color: var(--text-muted); text-align: left;">🔠 文字大小</div>
            <div class="modal-row">
                <button id="btn-size-small" class="btn-option" onclick="setTextSize('small')">小</button>
                <button id="btn-size-medium" class="btn-option selected" onclick="setTextSize('medium')">中</button>
                <button id="btn-size-large" class="btn-option" onclick="setTextSize('large')">大</button>
            </div>

            <button class="btn-add" style="width: 100%; margin-top: 10px; font-size: 1.1em;" onclick="toggleSettings()">✅ 儲存並關閉</button>
        </div>
    </div>

    <!-- 通用對話視窗 (用於 是/否 判斷與輸入) -->
    <div id="dialogModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="dialogTitle" style="margin-top: 0;">提示</h3>
            <div id="dialogBody" style="margin-bottom: 20px; color: var(--text-main);"></div>
            <input type="text" id="dialogInput" style="display:none; width:100%; margin-bottom: 20px; box-sizing:border-box;" placeholder="請輸入...">
            <div style="display:flex; gap:15px; justify-content:center;">
                <!-- 是 在左 #A8C7FA， 否 在右 #FF0033 -->
                <button class="btn-yes" onclick="submitDialog()">是</button>
                <button class="btn-no" onclick="closeDialog()">否</button>
            </div>
        </div>
    </div>

    <script>
        // === 系統與活動數據初始數值設定 ===
        const DEFAULT_COST = 36;
        const DEFAULT_AUTO_FILL = false;
        const DEFAULT_THEME = 'dark';
        const DEFAULT_FONT_SIZE = 'medium';
        const DEFAULT_PANEL_COLOR = '#23253A';
        const DEFAULT_ACTIVITY_NAME = '預設轉蛋池';

        let appData = {
            settings: { panelColor: DEFAULT_PANEL_COLOR, theme: DEFAULT_THEME, fontSize: DEFAULT_FONT_SIZE },
            currentActivity: DEFAULT_ACTIVITY_NAME,
            activities: {}
        };

        let parsedItems = [];
        let drawStats = { totalDraws: 0, cost: 0, value: 0 };
        let inventory = {};
        
        let isAutoFill = false; // 全域自動帶入價格狀態

        let drawTimer = null;
        let drawIntervalObj = null;
        let dialogCallback = null;

        /* === 初始化與存取機制 === */
        window.onload = function() {
            loadData();
        };

        // 監聽鍵盤 Enter 觸發「是」
        document.addEventListener('keydown', function(e) {
            const modal = document.getElementById('dialogModal');
            if (modal.style.display === 'flex' && e.key === 'Enter') {
                e.preventDefault();
                submitDialog();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.body.classList.contains('light-mode')) return;
            const x = e.clientX;
            const y = e.clientY;
            document.body.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255,255,255,0.03), transparent 400px) fixed, linear-gradient(to bottom left, var(--bg-start), var(--bg-end)) fixed`;
        });

        function saveData() {
            if (!appData.activities[appData.currentActivity]) return;
            
            appData.activities[appData.currentActivity].cost = parseFloat(document.getElementById('costPerDraw').value) || 0;
            appData.activities[appData.currentActivity].autoFill = isAutoFill;
            appData.activities[appData.currentActivity].items = parsedItems;
            appData.activities[appData.currentActivity].stats = drawStats;
            appData.activities[appData.currentActivity].inventory = inventory;
            
            localStorage.setItem('gachaSimulatorData', JSON.stringify(appData));
            renderActivityButtons();
        }

        function loadData() {
            const saved = localStorage.getItem('gachaSimulatorData');
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                } catch (e) {
                    initDefaultActivity();
                }
            } else {
                initDefaultActivity();
            }

            if (!appData.activities || Object.keys(appData.activities).length === 0) {
                initDefaultActivity();
            }
            if (!appData.activities[appData.currentActivity]) {
                appData.currentActivity = Object.keys(appData.activities)[0];
            }

            applySettings();
            switchActivity(appData.currentActivity);
        }

        function initDefaultActivity() {
            appData.activities = {};
            appData.activities[DEFAULT_ACTIVITY_NAME] = {
                cost: DEFAULT_COST,
                autoFill: DEFAULT_AUTO_FILL,
                items: [],
                stats: { totalDraws: 0, cost: 0, value: 0 },
                inventory: {}
            };
            appData.currentActivity = DEFAULT_ACTIVITY_NAME;
        }

        /* === 活動管理機制 === */
        function switchActivity(name) {
            appData.currentActivity = name;
            const act = appData.activities[name];
            
            document.getElementById('costPerDraw').value = act.cost !== undefined ? act.cost : DEFAULT_COST;
            
            isAutoFill = act.autoFill || false;
            updateAutoFillButtonUI();
            
            parsedItems = act.items || [];
            drawStats = act.stats || { totalDraws: 0, cost: 0, value: 0 };
            inventory = act.inventory || {};

            renderActivityButtons();
            renderSetupList();
            updateStatsDisplay();
            renderInventory();
            updateAIReview();
            saveData();
        }

        function renderActivityButtons() {
            const container = document.getElementById('activityButtons');
            container.innerHTML = '';
            
            Object.keys(appData.activities).forEach(name => {
                const btn = document.createElement('button');
                btn.className = `btn-activity ${name === appData.currentActivity ? 'selected' : ''}`;
                btn.innerText = name;
                btn.onclick = () => switchActivity(name);
                container.appendChild(btn);
            });
        }

        function promptAddActivity() {
            openDialog('新增活動', '請輸入新活動名稱：', true, (val) => {
                const name = val.trim();
                if (!name) return alert('名稱不可為空！');
                if (appData.activities[name]) return alert('活動名稱已存在！');
                
                appData.activities[name] = { cost: DEFAULT_COST, autoFill: DEFAULT_AUTO_FILL, items: [], stats: { totalDraws: 0, cost: 0, value: 0 }, inventory: {} };
                switchActivity(name);
            });
        }

        function promptDeleteActivity() {
            openDialog('刪除活動', `確定要刪除活動「${appData.currentActivity}」嗎？`, false, () => {
                delete appData.activities[appData.currentActivity];
                const remaining = Object.keys(appData.activities);
                if (remaining.length === 0) {
                    initDefaultActivity();
                } else {
                    appData.currentActivity = remaining[0];
                }
                switchActivity(appData.currentActivity);
            });
        }

        function promptClearItems() {
            openDialog('重製道具', '確定要刪除所有設定的道具嗎？', false, () => {
                parsedItems = [];
                resetSim();
                updateAIReview();
                saveData();
                renderSetupList();
            });
        }

        function handleCostChange() {
            saveData();
            updateAIReview();
        }
        
        function toggleAutoFill() {
            isAutoFill = !isAutoFill;
            updateAutoFillButtonUI();
            saveData();
        }
        
        function updateAutoFillButtonUI() {
            const btn = document.getElementById('btnAutoFill');
            if (isAutoFill) {
                btn.className = 'btn-autofill-on';
                btn.innerText = '自動帶入價格 ✅';
            } else {
                btn.className = 'btn-autofill-off';
                btn.innerText = '自動帶入價格 ❌';
            }
        }

        /* === 對話框機制 (遵守是/否顏色與左右排列規定) === */
        function openDialog(title, text, showInput, callback) {
            document.getElementById('dialogTitle').innerText = title;
            document.getElementById('dialogBody').innerText = text;
            const inputEl = document.getElementById('dialogInput');
            inputEl.style.display = showInput ? 'block' : 'none';
            inputEl.value = '';
            document.getElementById('dialogModal').style.display = 'flex';
            
            if (showInput) {
                inputEl.focus();
            }
            
            dialogCallback = callback;
        }

        function closeDialog() {
            document.getElementById('dialogModal').style.display = 'none';
            dialogCallback = null;
        }

        function submitDialog() {
            const val = document.getElementById('dialogInput').value;
            if (dialogCallback) dialogCallback(val);
            closeDialog();
        }

        /* === 系統設定機制 === */
        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function applySettings() {
            changePanelColor(appData.settings.panelColor || DEFAULT_PANEL_COLOR);
            document.getElementById('panelColor').value = appData.settings.panelColor || DEFAULT_PANEL_COLOR;
            setTheme(appData.settings.theme || DEFAULT_THEME, false);
            setTextSize(appData.settings.fontSize || DEFAULT_FONT_SIZE, false);
        }

        function changePanelColor(color) {
            document.documentElement.style.setProperty('--panel-bg', color);
            appData.settings.panelColor = color;
            localStorage.setItem('gachaSimulatorData', JSON.stringify(appData));
        }

        function resetPanelColor() {
            const color = document.body.classList.contains('light-mode') ? '#FFFFFF' : DEFAULT_PANEL_COLOR;
            document.getElementById('panelColor').value = color;
            changePanelColor(color);
        }

        function setTheme(theme, save = true) {
            document.getElementById('btn-dark').classList.remove('selected');
            document.getElementById('btn-light').classList.remove('selected');
            
            if (theme === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('btn-light').classList.add('selected');
                document.body.style.background = '';
            } else {
                document.body.classList.remove('light-mode');
                document.getElementById('btn-dark').classList.add('selected');
                document.body.style.background = 'linear-gradient(to bottom left, var(--bg-start), var(--bg-end)) fixed';
            }
            if(save) {
                appData.settings.theme = theme;
                localStorage.setItem('gachaSimulatorData', JSON.stringify(appData));
            }
        }

        function setTextSize(size, save = true) {
            document.body.classList.remove('text-small', 'text-medium', 'text-large');
            document.body.classList.add(`text-${size}`);
            
            document.getElementById('btn-size-small').classList.remove('selected');
            document.getElementById('btn-size-medium').classList.remove('selected');
            document.getElementById('btn-size-large').classList.remove('selected');
            document.getElementById(`btn-size-${size}`).classList.add('selected');
            
            if(save) {
                appData.settings.fontSize = size;
                localStorage.setItem('gachaSimulatorData', JSON.stringify(appData));
            }
        }

        function toggleParseSection() {
            const body = document.getElementById('parseBody');
            const header = document.getElementById('parseHeader');
            if (body.style.maxHeight === '0px' || !body.style.maxHeight) {
                body.style.maxHeight = '200px';
                header.innerText = '▼ 智慧文字解析';
            } else {
                body.style.maxHeight = '0px';
                header.innerText = '▶ 智慧文字解析';
            }
        }

        /* === 業務計算邏輯 === */
        function calcBalancedValue(prob, cost, totalItemsCount) {
            if (prob > 0 && cost > 0 && totalItemsCount > 0) {
                return Math.round((cost / (prob / 100)) / totalItemsCount);
            }
            return 0;
        }

        function parseItems() {
            const text = document.getElementById('inputText').value.trim();
            if (!text) return alert("請先貼上文字！");

            const cost = parseFloat(document.getElementById('costPerDraw').value) || 0;

            const regex = /([\s\S]*?)(\d+\.\d+%)/g;
            let match;
            let matchesList = [];

            while ((match = regex.exec(text)) !== null) {
                if(match[1].trim() !== "") matchesList.push(match);
            }

            if (matchesList.length === 0) {
                return alert("無法解析格式！請確認貼上的文字包含官方帶有小數點的機率（如 0.55%）。");
            }

            let N = matchesList.length;
            let tempTotalProb = matchesList.reduce((sum, m) => sum + parseFloat(m[2].replace('%', '')), 0);
            if (tempTotalProb < 100) N += 1; 

            matchesList.forEach(m => {
                let name = m[1].trim();
                let prob = parseFloat(m[2].replace('%', ''));
                let value = isAutoFill ? calcBalancedValue(prob, cost, N) : 0;
                parsedItems.push({ name, probStr: m[2], prob, value });
            });

            let currentTotal = parsedItems.reduce((sum, item) => sum + item.prob, 0);
            if (currentTotal < 100) {
                let remain = (100 - currentTotal).toFixed(2);
                parsedItems.push({ name: "⚠️ 未中獎 (機率不足補償)", probStr: remain + "%", prob: parseFloat(remain), value: 0 });
            }

            document.getElementById('parseBody').style.maxHeight = '0px';
            document.getElementById('parseHeader').innerText = '▶ 智慧文字解析';
            document.getElementById('inputText').value = '';

            renderSetupList();
            resetSim();
            updateAIReview();
            saveData();
        }

        function addManualItem() {
            const name = document.getElementById('manualName').value.trim();
            const prob = parseFloat(document.getElementById('manualProb').value);
            let value = parseFloat(document.getElementById('manualValue').value);
            const cost = parseFloat(document.getElementById('costPerDraw').value) || 0;

            if (!name || isNaN(prob) || prob < 0) return alert("請輸入正確的名稱與機率！");
            if (isNaN(value)) value = 0;
            if (isAutoFill && value === 0) value = calcBalancedValue(prob, cost, 1);

            parsedItems.push({ name, probStr: prob + "%", prob, value });

            document.getElementById('manualName').value = '';
            document.getElementById('manualProb').value = '';
            document.getElementById('manualValue').value = '';

            renderSetupList();
            resetSim();
            updateAIReview();
            saveData();
        }

        function updateItemData(index, field, val) {
            if (field === 'name') parsedItems[index].name = val;
            else if (field === 'prob') {
                let p = parseFloat(val) || 0;
                parsedItems[index].prob = p;
                parsedItems[index].probStr = p + "%";
            } 
            else if (field === 'value') parsedItems[index].value = parseFloat(val) || 0;
            
            updateAIReview();
            saveData();
        }

        function deleteItem(index) {
            parsedItems.splice(index, 1);
            renderSetupList();
            resetSim();
            updateAIReview();
            saveData();
        }

        function renderSetupList() {
            const container = document.getElementById('setupList');
            container.innerHTML = "";

            if (parsedItems.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:30px; color: var(--text-muted);">請先解析內容或手動新增道具</div>';
                return;
            }

            parsedItems.forEach((item, index) => {
                if(inventory[index] === undefined) inventory[index] = 0;
                const row = document.createElement('div');
                row.className = 'setup-item';
                row.innerHTML = `
                    <input type="text" class="list-input" value="${item.name}" onchange="updateItemData(${index}, 'name', this.value)">
                    <input type="number" class="list-input" step="0.1" value="${item.prob}" onchange="updateItemData(${index}, 'prob', this.value)">
                    <input type="number" class="list-input" value="${item.value}" onchange="updateItemData(${index}, 'value', this.value)">
                    <div style="display:flex; justify-content:center;">
                        <button class="action-btn" onclick="deleteItem(${index})">✖</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        /* === 連續抽卡機制 === */
        function startDraw(times) {
            draw(times); 
            drawTimer = setTimeout(() => {
                drawIntervalObj = setInterval(() => draw(times), 80); 
            }, 400); 
        }

        function stopDraw() {
            clearTimeout(drawTimer);
            clearInterval(drawIntervalObj);
        }

        function draw(times) {
            if (parsedItems.length === 0) return;

            const costPerDraw = parseFloat(document.getElementById('costPerDraw').value) || 0;

            for (let i = 0; i < times; i++) {
                let rand = Math.random() * 100;
                let cumulative = 0;
                for (let j = 0; j < parsedItems.length; j++) {
                    cumulative += parsedItems[j].prob;
                    if (rand <= cumulative) {
                        inventory[j] = (inventory[j] || 0) + 1;
                        drawStats.value += parsedItems[j].value;
                        break;
                    }
                }
            }

            drawStats.totalDraws += times;
            drawStats.cost += times * costPerDraw;
            
            updateStatsDisplay();
            renderInventory();
            saveData();
        }

        function updateStatsDisplay() {
            const profit = drawStats.value - drawStats.cost;
            document.getElementById('statDraws').innerText = drawStats.totalDraws.toLocaleString();
            document.getElementById('statCost').innerText = drawStats.cost.toLocaleString();
            document.getElementById('statValue').innerText = drawStats.value.toLocaleString();
            
            const profitEl = document.getElementById('statProfit');
            profitEl.innerText = profit.toLocaleString();
            
            if (profit > 0) { profitEl.className = "stat-value text-green"; profitEl.innerText = "+" + profit.toLocaleString(); } 
            else if (profit < 0) { profitEl.className = "stat-value text-red"; } 
            else { profitEl.className = "stat-value"; }
        }

        function renderInventory() {
            const container = document.getElementById('inventoryList');
            container.innerHTML = "";
            if (drawStats.totalDraws === 0) return;

            parsedItems.forEach((item, index) => {
                const count = inventory[index] || 0;
                if (count > 0) {
                    const row = document.createElement('div');
                    row.className = 'inv-grid';
                    const totalVal = count * item.value;
                    const actualProb = (count / drawStats.totalDraws) * 100;
                    
                    let probStyle = "color: var(--text-muted);";
                    let arrow = "";
                    if (actualProb > item.prob) { probStyle = "color: #4CAF50;"; arrow = "▲"; } 
                    else if (actualProb < item.prob) { probStyle = "color: #EF5350;"; arrow = "▼"; }

                    row.innerHTML = `
                        <span title="${item.name}" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${item.name}</span>
                        <span>${count}</span>
                        <span>${totalVal.toLocaleString()}</span>
                        <span style="${probStyle}">${actualProb.toFixed(2)}% ${arrow}</span>
                    `;
                    container.appendChild(row);
                }
            });
        }

        function resetSim() {
            drawStats = { totalDraws: 0, cost: 0, value: 0 };
            for (let k in inventory) inventory[k] = 0;
            updateStatsDisplay();
            renderInventory();
            saveData();
        }

        function updateAIReview() {
            const expectedEl = document.getElementById('aiExpected');
            const reviewEl = document.getElementById('aiReviewText');

            if (parsedItems.length === 0) {
                expectedEl.innerText = "🤖 期望回報：等待數據";
                reviewEl.innerText = "AI評論：等待分析中...";
                return;
            }

            let expectedValue = 0;
            let hasInputValues = false;
            let totalProb = 0;

            parsedItems.forEach(item => {
                expectedValue += (item.prob / 100) * item.value;
                totalProb += item.prob;
                if (item.value > 0) hasInputValues = true;
            });

            const cost = parseFloat(document.getElementById('costPerDraw').value) || 0;
            
            expectedEl.innerText = `🤖 期望回報：${expectedValue.toFixed(2)} 元 / 抽`;

            let comment = "";
            if (totalProb > 100.1) {
                comment = `⚠️ 警告：總機率(${totalProb.toFixed(2)}%)超過100%！請檢查道具設定。`;
                reviewEl.style.color = "#FF0033";
            } else {
                reviewEl.style.color = ""; 
                if (!hasInputValues) {
                    comment = "AI評論：尚未輸入道具價值，目前的抽取為純娛樂性質，抽多少虧多少！📉";
                } else if (cost === 0) {
                    comment = "AI評論：單抽成本為0，屬於無本生意，請盡情享受白嫖的樂趣！🎉";
                } else {
                    let cpRatio = expectedValue / cost;
                    if (cpRatio >= 0.9 && cpRatio <= 1.1) {
                        comment = `AI評論：已啟用自動計算或達成數值平衡！依目前設定，抽獎總期望值與成本已達動態平衡。⚖️`;
                    } else if (cpRatio >= 1.5) {
                        comment = `AI評論：CP值極高！期望回報遠超成本(${cost})，這池太香了建議抽爆！🤑`;
                    } else if (cpRatio > 1.1) {
                        comment = `AI評論：CP值不錯！期望回報略高於成本(${cost})，值得小試身手。👍`;
                    } else if (cpRatio >= 0.5) {
                        comment = `AI評論：CP值偏低。期望回報低於成本(${cost})，請謹慎衡量自身荷包。🤔`;
                    } else {
                        comment = `AI評論：CP值極低！期望回報慘不忍睹，這根本是陷阱，快逃！🏃‍♂️💨`;
                    }
                }
            }
            reviewEl.innerText = comment;
        }
    </script>
</body>
