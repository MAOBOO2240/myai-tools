<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapleStory EXP Pro</title>
    <style>
        /* =========================================================
           統一設定區：全面導入 Windows 11 圓角與現代流線感微調
           ========================================================= */
        :root {
            /* --- 圓角設定 (以圓角為主) --- */
            --radius-panel: 20px;
            --radius-input: 12px;
            --radius-button: 24px;

            /* --- 排版與框架大小 --- */
            --layout-max-width: 1500px;
            --layout-gap: 20px;
            --layout-left-col: 1fr;
            --layout-right-col: 560px;

            /* --- 內外邊距 --- */
            --body-padding: 30px 20px 30px 90px;
            --panel-padding: 26px;
            --h2-margin-bottom: 18px;
            --h2-padding-bottom: 8px;
            --form-row-gap: 15px;
            --form-row-margin-bottom: 14px;
            --input-padding: 11px;
            
            /* --- 寬度與高度 --- */
            --input-width: 100%;
            --short-input-width: 100%;
            --theme-btn-size: 52px;
            --checkbox-size: 18px;
            
            /* --- 字體大小 --- */
            --font-size-base: 1rem;
            --font-size-h2: 1.15rem;
            --font-size-label: 0.85rem;
            --font-size-check: 0.85rem;
            --font-size-forecast: 0.88rem;
            --font-size-theme-btn: 1.6rem;
            --font-size-lock-btn: 0.9rem;

            /* --- 顏色設定 (亮色主題) --- */
            --bg: linear-gradient(135deg, #f3f9ff 0%, #e2eafc 100%);
            --glass: rgba(255, 255, 255, 0.78);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text: #1c1c1c;
            --accent: #0078d4;
            --input: rgba(255, 255, 255, 0.9);
            --shadow: 0 8px 32px rgba(31, 38, 135, 0.06);
            --item-bg: rgba(0,0,0,0.03);
            --btn-hover: rgba(255, 255, 255, 1);
        }

        [data-theme="dark"] {
            --bg: linear-gradient(135deg, #1e1e24 0%, #121215 100%);
            --glass: rgba(35, 35, 40, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text: #f5f5f5;
            --accent: #60cdff;
            --input: rgba(25, 25, 30, 0.6);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            --item-bg: rgba(255,255,255,0.05);
            --btn-hover: rgba(55, 55, 60, 0.9);
        }

        * {
            transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, transform 0.2s ease;
            border-radius: inherit;
        }

        body {
            font-family: "Segoe UI", -apple-system, sans-serif;
            margin: 0; 
            padding: var(--body-padding); 
            font-size: var(--font-size-base);
            min-height: 100vh;
            background: var(--bg); color: var(--text);
            display: flex; justify-content: center;
        }

        .layout {
            display: grid; 
            grid-template-columns: var(--layout-left-col) var(--layout-right-col);
            gap: var(--layout-gap); 
            width: 100%; 
            max-width: var(--layout-max-width);
        }

        .panel {
            background: var(--glass); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-panel); 
            padding: var(--panel-padding); 
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .theme-toggle-container {
            position: fixed;
            left: 20px;
            top: 30px;
            width: var(--theme-btn-size);
            height: var(--theme-btn-size);
            border-radius: 50%;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; user-select: none;
            z-index: 100;
        }
        .theme-toggle-container:hover { background: var(--btn-hover); transform: scale(1.05); }
        .theme-toggle-container:active { transform: scale(0.95); }
        .theme-btn { font-size: var(--font-size-theme-btn); margin: 0; }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: var(--h2-margin-bottom);
        }

        h2 { 
            margin: 0; 
            font-size: var(--font-size-h2); 
            border-bottom: 2px solid var(--accent); 
            padding-bottom: var(--h2-padding-bottom); 
            width: fit-content; 
            border-radius: 0;
        }

        .lock-btn {
            background: var(--accent); color: #fff;
            border: none; padding: 8px 20px; border-radius: var(--radius-button);
            cursor: pointer; font-size: var(--font-size-lock-btn);
            font-weight: bold; box-shadow: var(--shadow);
        }
        .lock-btn.locked { background: #ff4d4f; }

        .form-row { 
            display: grid; grid-template-columns: 1fr 1fr; 
            gap: var(--form-row-gap); margin-bottom: var(--form-row-margin-bottom); 
        }

        label { display: block; font-size: var(--font-size-label); margin-bottom: 6px; font-weight: 600; }
        
        input, select {
            width: var(--input-width); padding: var(--input-padding); 
            border-radius: var(--radius-input); border: 1px solid var(--glass-border);
            background: var(--input); color: var(--text); outline: none; box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.15);
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        .check-group { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; }
        .check-item { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: var(--font-size-check); }
        
        input[type="radio"], input[type="checkbox"] {
            appearance: none; width: var(--checkbox-size); height: var(--checkbox-size); 
            border: 2px solid var(--accent);
            border-radius: 4px; cursor: pointer; position: relative; background: var(--input);
            margin: 0;
        }
        input[type="radio"] { border-radius: 50%; }
        input:checked::before {
            content: ""; position: absolute; width: calc(var(--checkbox-size) / 2); height: calc(var(--checkbox-size) / 2);
            background: var(--accent); border-radius: 2px; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        input[type="radio"]:checked::before { border-radius: 50%; }

        .forecast-list {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; margin-top: 15px; max-height: 70vh; overflow-y: auto;
            padding-right: 8px;
        }
        .forecast-item {
            display: flex; justify-content: space-between; padding: 12px;
            background: var(--item-bg); border-radius: var(--radius-input); font-size: var(--font-size-forecast);
            border-left: 4px solid var(--accent);
        }
        .lvl-tag { font-weight: bold; }
        .date-val { opacity: 0.8; }

        @media (max-width: 1100px) {
            body { padding: 20px; }
            .layout { grid-template-columns: 1fr; }
            .theme-toggle-container { left: auto; right: 20px; top: 20px; }
        }
    </style>
</head>
<body>

<div class="theme-toggle-container" onclick="toggleTheme()">
    <span id="themeBtn" class="theme-btn">☀️</span>
</div>

<div class="layout">
    <!-- 左側參數面板 -->
    <div class="panel input-panel">
        <div class="header-flex">
            <h2>⚙️ 練功參數</h2>
        </div>

        <div class="form-row">
            <div>
                <label>👤 當前等級</label>
                <input type="number" id="level" value="260">
            </div>
            <div>
                <label>🎯 目標等級</label>
                <input type="number" id="targetLevel" value="300">
            </div>
        </div>
        
        <div class="form-row">
            <div>
                <label>📊 當前經驗 %</label>
                <input type="number" id="curExpP" step="0.0001" value="0">
            </div>
            <div>
                <label>⚔️ 打怪基礎每秒經驗 (未計算等差)</label>
                <input type="text" id="expPerSec" placeholder="11E">
            </div>
        </div>

        <div class="form-row">
            <div>
                <label>👾 獵殺怪物等級 (用以計算等差懲罰)</label>
                <input type="number" id="mobLevel" value="260" placeholder="請輸入怪物等級">
            </div>
            <div>
                <label>⏱️ 等差經驗修正狀態</label>
                <input type="text" id="penaltyStatus" value="100% (無等差)" readonly style="opacity: 0.7; background: transparent; border-style: dashed;">
            </div>
        </div>

        <div class="form-row">
            <div>
                <label>每日時數 (hr)</label>
                <input type="number" id="huntH" value="1" min="0" max="23" oninput="if(this.value > 23) this.value = 23; if(this.value < 0) this.value = 0;">
            </div>
            <div>
                <label>每日分鐘 (min)</label>
                <input type="number" id="huntM" value="0" min="0" max="60" oninput="if(this.value > 60) this.value = 60; if(this.value < 0) this.value = 0;">
            </div>
        </div>
        
        <div class="form-row">
            <div>
                <label>🎢 怪物公園 (每日 0-7次)</label>
                <input type="number" id="mpDaily" value="0" min="0" max="7" oninput="if(this.value > 7) this.value = 7; if(this.value < 0) this.value = 0;">
            </div>
            <div>
                <label>選擇區域 (需符合等級)</label>
                <select id="mpRegion">
                    <option value="none">不打</option>
                    <option value="morass">魔菈斯 (Lv.235+)</option>
                    <option value="esfera">艾斯佩拉 (Lv.240+)</option>
                    <option value="sellas">賽拉斯 (Lv.245+)</option>
                    <option value="moonbridge">月之橋 (Lv.250+)</option>
                    <option value="labyrinth">苦痛的迷宮 (Lv.255+)</option>
                    <option value="limina">利曼 (Lv.260+)</option>
                    <option value="cernium">賽爾尼溫 (Lv.260+)</option>
                    <option value="arcs">阿爾克斯 (Lv.265+)</option>
                    <option value="odium">奧迪溫 (Lv.270+)</option>
                </select>
            </div>
        </div>

        <label>指定練功日</label>
        <div class="check-group">
            <label class="check-item"><input type="checkbox" class="day-check" value="1" checked>一</label>
            <label class="check-item"><input type="checkbox" class="day-check" value="2" checked>二</label>
            <label class="check-item"><input type="checkbox" class="day-check" value="3" checked>三</label>
            <label class="check-item"><input type="checkbox" class="day-check" value="4" checked>四</label>
            <label class="check-item"><input type="checkbox" class="day-check" value="5" checked>五</label>
            <label class="check-item"><input type="checkbox" class="day-check" value="6" checked>六</label>
            <label class="check-item"><input type="checkbox" class="day-check" value="0" checked>日</label>
        </div>

        <h2 style="margin-top: 25px;">🪑 掛機系統</h2>
        <div class="form-row">
            <div>
                <label>掛機經驗 (每5秒)</label>
                <input type="text" id="afkExp" placeholder="1E2000W">
            </div>
            <div>
                <label>每日掛機時數 (hr)</label>
                <input type="number" id="afkH" placeholder="0" min="0" max="24" oninput="if(this.value > 24) this.value = 24; if(this.value < 0) this.value = 0;">
            </div>
        </div>

        <h2 style="margin-top: 25px;">🏔️ 週常活動</h2>
        <div class="form-group">
            <label>紅月之森 (Lv. 260+)</label>
            <div class="check-group">
                <label class="check-item"><input type="checkbox" id="rmPart" checked> 參與</label>
                <label class="check-item"><input type="checkbox" id="rmCert"> 托圖伊保證書 (x2)</label>
            </div>
        </div>
        <div class="form-group">
            <label>終極怪物公園 (Lv. 260+)</label>
            <div class="check-group">
                <label class="check-item"><input type="checkbox" id="exPart" checked> 參與</label>
            </div>
        </div>
        
        <div class="form-group">
            <label>史詩副本 (進度互斥)</label>
            <div class="check-group" style="margin-bottom: 10px;">
                <label class="check-item"><input type="checkbox" id="epiHigh"> 高山 (260+)</label>
                <label class="check-item"><input type="checkbox" id="epiAng"> 安格洛 (270+)</label>
                <label class="check-item"><input type="checkbox" id="epiNight"> 惡夢仙境 (280+)</label>
            </div>
            <div class="form-row" style="margin-bottom: 0;">
                <div>
                    <label>額外購買次數 (最高10次)</label>
                    <select id="epiBuy">
                        <option value="0">0 次 (不購買)</option>
                        <option value="1">1 次</option>
                        <option value="2">2 次</option>
                        <option value="3">3 次</option>
                        <option value="4">4 次</option>
                        <option value="5">5 次</option>
                        <option value="6">6 次</option>
                        <option value="7">7 次</option>
                        <option value="8">8 次</option>
                        <option value="9">9 次</option>
                        <option value="10">10 次</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- 右側升等時程預測面板 -->
    <div class="panel">
        <div class="header-flex">
            <h2>📅 升等時程預測</h2>
            <button id="lockBtn" class="lock-btn" onclick="toggleLock()">🔒 鎖定計畫基準</button>
        </div>
        <div id="summary" style="margin-bottom:15px; font-weight:bold; color:var(--accent);"></div>
        <div class="forecast-list" id="forecastList"></div>
    </div>
</div>

<script>
    let isLocked = false;

    // 經驗值要求表
    const EXP_REQ = {
        1:15, 2:34, 3:57, 4:92, 5:135, 200:2207026470, 250:442457484960, 
        260:1731919984062, 261:1749239183902, 262:1766731575741, 263:1784398891498, 264:1802242880412,
        265:2342915744535, 266:2366344901980, 267:2390008350999, 268:2413908434508, 269:2438047518853,
        270:5412465491853, 271:5466590146771, 272:5521256048238, 273:5576468608720, 274:5632233294807,
        275:11377111255510, 276:12514822381061, 277:13766304619167, 278:15142935081083, 279:16657228589191,
        280:33647601750165, 281:37012361925181, 282:40713598117699, 283:44784957929468, 284:49263453722414,
        285:99512176519276, 286:109463394171203, 287:120409733588323, 288:132450706947155, 289:145695777641870,
        290:294305470836577, 291:323736017920234, 292:356109619712257, 293:391720581683482, 294:430892639851830,
        295:870403132500696, 296:957443445750765, 297:1053187790325840, 298:1158506569358420, 299:1737759854037630
    };
    
    // 週常活動基礎數據
    const RM_BASE = { 260: 2652e8, 270: 5670e8, 280: 10614.2e8, 290: 10993.3e8 };
    const EX_BASE = { 260: 530.4e8, 270: 1134e8, 280: 1632.9e8, 290: 1691.2e8 };

    // 史詩副本 1：高山 (HM)
    const HM_DATA = {
        260: 2609e8, 261: 2647e8, 262: 2685e8, 263: 2722e8, 264: 2765e8,
        265: 3110e8, 266: 3153e8, 267: 3196e8, 268: 3245e8, 269: 3288e8,
        270: 3698e8, 271: 3752e8, 272: 3801e8, 273: 3850e8, 274: 3906e8,
        275: 4390e8, 276: 4445e8, 277: 4508e8, 278: 4564e8, 279: 4627e8,
        280: 5196e8, 281: 5267e8, 282: 5330e8, 283: 5401e8, 284: 5465e8,
        285: 6144e8, 286: 6215e8, 287: 6296e8, 288: 6377e8, 289: 6450e8,
        290: 7248e8, 291: 7329e8, 292: 7421e8, 293: 7514e8, 294: 7596e8,
        295: 7596e8, 296: 7596e8, 297: 7596e8, 298: 7596e8, 299: 7596e8
    };

    // 史詩副本 2：安格洛 (AC)
    const AC_DATA = {
        270: 5547e8, 271: 5628e8, 272: 5701.5e8, 273: 5775e8, 274: 5859e8,
        275: 6585e8, 276: 6667.5e8, 277: 6762e8, 278: 6846e8, 279: 6940.5e8,
        280: 7794e8, 281: 7900.5e8, 282: 7995e8, 283: 8101.5e8, 284: 8197.5e8,
        285: 9216e8, 286: 9322.5e8, 287: 9444e8, 288: 9565.5e8, 289: 9675e8,
        290: 10872e8, 291: 10993.5e8, 292: 11131.5e8, 293: 11271e8, 294: 11394e8,
        295: 11394e8, 296: 11394e8, 297: 11394e8, 298: 11394e8, 299: 11394e8
    };

    // 史詩副本 3：惡夢仙境 (NW)
    const NW_DATA = {
        280: 10911e8, 281: 11060e8, 282: 11193e8, 283: 11342e8, 284: 11476e8,
        285: 12902e8, 286: 13051e8, 287: 13221e8, 288: 13391e8, 289: 13545e8,
        290: 15220e8, 291: 15390e8, 292: 15584e8, 293: 15779e8, 294: 15951e8,
        295: 15951e8, 296: 15951e8, 297: 15951e8, 298: 15951e8, 299: 15951e8
    };

    const MP_DATA = {
        'morass': { req: 235, exp: 2996755520 },
        'esfera': { req: 240, exp: 3459833685 },
        'sellas': { req: 245, exp: 4356407460 },
        'moonbridge': { req: 250, exp: 5858308250 },
        'labyrinth': { req: 255, exp: 7029450500 },
        'limina': { req: 260, exp: 7776278700 },
        'cernium': { req: 260, exp: 43845287218 },
        'arcs': { req: 265, exp: 51989472171 },
        'odium': { req: 270, exp: 61798037184 }
    };

    // 核心等差打怪經驗補正乘數計算
    function getLevelPenaltyRatio(charLvl, mobLvl) {
        if (!mobLvl) return 1.0;
        const diff = charLvl - mobLvl;
        
        if (diff === 0) return 1.20; 
        if (diff === 1 || diff === -1) return 1.10;
        if (diff === 2 || diff === -2) return 1.05;
        if (diff === 3 || diff === -3) return 1.00;
        if (diff >= 4 && diff <= 9) return 0.95;
        if (diff <= -4 && diff >= -9) return 0.70;
        if (diff >= 10 && diff <= 15) return 0.90;
        if (diff <= -10 && diff >= -15) return 0.30;
        if (diff >= 16 && diff <= 20) return 0.70;
        if (diff <= -16 && diff >= -20) return 0.10;
        if (diff > 20) return 0.10;
        if (diff < -20) return 0.00; 
        return 1.0;
    }

    function parseExp(str) {
        if(!str) return 0;
        str = str.toString();
        let val = 0;
        const eMatch = str.toUpperCase().match(/(\d+)\s*[E億]/);
        const wMatch = str.toUpperCase().match(/(\d+)\s*[W萬]/);
        if(eMatch) val += parseInt(eMatch[1]) * 1e8;
        if(wMatch) val += parseInt(wMatch[1]) * 1e4;
        return val || parseInt(str.replace(/,/g, '')) || 0;
    }

    function formatSimulationDate(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}/${m}/${d}`;
    }

    // 模擬計算引擎 (引入動態等差變化)
    function runSimulation(startLvl, startPct, targetLvl) {
        const eps = parseExp(document.getElementById('expPerSec').value) || parseExp("11E"); 
        const mobLvl = parseInt(document.getElementById('mobLevel').value) || startLvl;
        const hH = parseInt(document.getElementById('huntH').value) || 0;
        const hM = parseInt(document.getElementById('huntM').value) || 0;
        const huntSec = (hH * 3600) + (hM * 60);
        
        const mpDaily = parseInt(document.getElementById('mpDaily').value) || 0;
        const mpRegion = document.getElementById('mpRegion').value;
        const huntDays = Array.from(document.querySelectorAll('.day-check:checked')).map(el => parseInt(el.value));
        const afkBase = parseExp(document.getElementById('afkExp').value) || 0;
        const afkSec = (parseFloat(document.getElementById('afkH').value) || 0) * 3600;

        let dayCount = 0;
        let tempLvl = startLvl;
        let today = new Date();
        let currentExpOwned = (EXP_REQ[tempLvl] || 0) * (startPct / 100);
        let schedule = {};

        // 更新 UI 面板上的即時起始等差狀態提示
        const initRatio = getLevelPenaltyRatio(startLvl, mobLvl);
        document.getElementById('penaltyStatus').value = `${Math.round(initRatio * 100)}% (${startLvl - mobLvl >= 0 ? '超前' : '落後'} ${Math.abs(startLvl - mobLvl)} 等差)`;

        while(tempLvl < targetLvl && dayCount < 7300) { 
            dayCount++;
            today.setDate(today.getDate() + 1);
            let dayOfWeek = today.getDay();
            let dailyGain = 0;

            if(huntDays.includes(dayOfWeek)) {
                let dynamicPenaltyRatio = getLevelPenaltyRatio(tempLvl, mobLvl);
                dailyGain += (eps * dynamicPenaltyRatio) * huntSec;
            }
            
            if(tempLvl >= 100) dailyGain += (afkBase / 5) * afkSec;

            if(mpDaily > 0 && mpRegion !== 'none' && MP_DATA[mpRegion]) {
                if (tempLvl >= MP_DATA[mpRegion].req) {
                    dailyGain += mpDaily * MP_DATA[mpRegion].exp;
                }
            }
            
            if(dayOfWeek === 0 && tempLvl >= 260) {
                if(document.getElementById('rmPart').checked) {
                    let rm = RM_BASE[Math.floor(tempLvl/10)*10] || RM_BASE[290];
                    dailyGain += document.getElementById('rmCert').checked ? rm*2 : rm;
                }
                if(document.getElementById('exPart').checked) {
                    dailyGain += (EX_BASE[Math.floor(tempLvl/10)*10] || EX_BASE[290]);
                }

                let isEpiHigh = document.getElementById('epiHigh').checked;
                let isEpiAng = document.getElementById('epiAng').checked;
                let isEpiNight = document.getElementById('epiNight').checked;

                if (isEpiHigh || isEpiAng || isEpiNight) {
                    let buyCount = parseInt(document.getElementById('epiBuy').value) || 0;
                    let baseEpiExp = 0;

                    if (isEpiHigh && tempLvl >= 260) {
                        baseEpiExp = HM_DATA[tempLvl] || HM_DATA[299];
                    } else if (isEpiAng && tempLvl >= 270) {
                        baseEpiExp = AC_DATA[tempLvl] || AC_DATA[299];
                    } else if (isEpiNight && tempLvl >= 280) {
                        baseEpiExp = NW_DATA[tempLvl] || NW_DATA[299];
                    }
                    
                    if (baseEpiExp > 0) {
                        dailyGain += baseEpiExp * (1 + (buyCount * 1.074));
                    }
                }
            }

            currentExpOwned += dailyGain;
            while(EXP_REQ[tempLvl] && currentExpOwned >= EXP_REQ[tempLvl]) {
                currentExpOwned -= EXP_REQ[tempLvl];
                tempLvl++;
                schedule[tempLvl] = {
                    dateStr: formatSimulationDate(today),
                    timestamp: new Date(today).setHours(0,0,0,0)
                };
                if(tempLvl >= targetLvl) break;
            }
        }
        return { totalDays: dayCount, schedule: schedule };
    }

    function calculate() {
        const curLvl = parseInt(document.getElementById('level').value) || 260;
        const tarLvl = parseInt(document.getElementById('targetLevel').value) || 300;
        const curPct = parseFloat(document.getElementById('curExpP').value) || 0;

        let currentSim = runSimulation(curLvl, curPct, tarLvl);

        if (isLocked) {
            let savedBaseline = localStorage.getItem('maple_baseline_data');
            if (savedBaseline) {
                let baselineData = JSON.parse(savedBaseline);
                let listHtml = "";

                for (let lvl in baselineData.schedule) {
                    let bItem = baselineData.schedule[lvl];
                    let cItem = currentSim.schedule[lvl];
                    let statusHtml = "";

                    if (cItem) {
                        let diffTime = cItem.timestamp - bItem.timestamp;
                        let diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
                        
                        if (diffDays < 0) {
                            statusHtml = `<span style="color:#52c41a; font-weight:bold;">🟢 超前 ${Math.abs(diffDays)} 天</span>`;
                        } else if (diffDays > 0) {
                            statusHtml = `<span style="color:#ff4d4f; font-weight:bold;">🔴 落後 ${diffDays} 天</span>`;
                        } else {
                            statusHtml = `<span style="color:var(--text); opacity:0.6;">⚪ 符合進度</span>`;
                        }

                        listHtml += `
                            <div class="forecast-item" style="flex-direction: column; gap: 4px;">
                                <div style="display:flex; justify-content:space-between; width:100%;">
                                    <span class="lvl-tag">Lv.${lvl}</span>
                                    ${statusHtml}
                                </div>
                                <div style="display:flex; justify-content:space-between; width:100%; font-size:0.75rem; opacity:0.7;">
                                    <span>基準: ${bItem.dateStr}</span>
                                    <span>目前預計: ${cItem.dateStr}</span>
                                </div>
                            </div>`;
                    } else {
                        statusHtml = `<span style="color:#ff4d4f; font-weight:bold;">⚠️ 無法估算</span>`;
                        listHtml += `
                            <div class="forecast-item" style="flex-direction: column; gap: 4px;">
                                <div style="display:flex; justify-content:space-between; width:100%;">
                                    <span class="lvl-tag">Lv.${lvl}</span>
                                    ${statusHtml}
                                </div>
                                <div style="display:flex; justify-content:space-between; width:100%; font-size:0.75rem; opacity:0.7;">
                                    <span>基準: ${bItem.dateStr}</span>
                                    <span>目前預計: --</span>
                                </div>
                            </div>`;
                    }
                }
                document.getElementById('forecastList').innerHTML = listHtml;

                let totalDiff = currentSim.totalDays - baselineData.totalDays;
                let diffStr = totalDiff < 0 ? `總時程縮短 ${Math.abs(totalDiff)} 天` : totalDiff > 0 ? `總時程延後 ${totalDiff} 天` : "完全符合計畫";
                let diffColor = totalDiff < 0 ? "#52c41a" : totalDiff > 0 ? "#ff4d4f" : "var(--accent)";
                
                document.getElementById('summary').innerHTML = `
                    <div style="font-size:0.9rem; line-height:1.5; background:var(--item-bg); padding:12px; border-radius:var(--radius-input); border-left:4px solid var(--accent);">
                        📌 永久基準：Lv.${baselineData.inputs.level} (${baselineData.inputs.curExpP}%) 預估需 ${baselineData.totalDays} 天<br>
                        ⏱️ 即時追蹤：當前修正預估需 ${currentSim.totalDays} 天 (<span style="color:${diffColor}; font-weight:bold;">${diffStr}</span>)
                    </div>`;
            }
        } else {
            let listHtml = "";
            for (let lvl in currentSim.schedule) {
                let item = currentSim.schedule[lvl];
                listHtml += `
                    <div class="forecast-item">
                        <span class="lvl-tag">Lv.${lvl}</span>
                        <span class="date-val">${item.dateStr}</span>
                    </div>`;
            }
            document.getElementById('forecastList').innerHTML = listHtml || "無法升等，請檢查收益設定";
            document.getElementById('summary').innerText = `預計花費：${currentSim.totalDays} 天`;
        }
        
        saveData();
    }

    function toggleLock() {
        isLocked = !isLocked;
        localStorage.setItem('maple_isLocked', isLocked);

        if (isLocked) {
            const curLvl = parseInt(document.getElementById('level').value) || 260;
            const tarLvl = parseInt(document.getElementById('targetLevel').value) || 300;
            const curPct = parseFloat(document.getElementById('curExpP').value) || 0;
            
            let snapshotSim = runSimulation(curLvl, curPct, tarLvl);
            let baselineObj = {
                totalDays: snapshotSim.totalDays,
                schedule: snapshotSim.schedule,
                inputs: { level: curLvl, curExpP: curPct, targetLevel: tarLvl }
            };
            localStorage.setItem('maple_baseline_data', JSON.stringify(baselineObj));
        } else {
            localStorage.removeItem('maple_baseline_data');
        }

        updateLockUI();
        calculate();
    }

    function updateLockUI() {
        const btn = document.getElementById('lockBtn');
        if (isLocked) {
            btn.innerText = '🔓 解除鎖定計畫';
            btn.classList.add('locked');
        } else {
            btn.innerText = '🔒 鎖定計畫基準';
            btn.classList.remove('locked');
        }
    }

    function saveData() {
        const data = {};
        document.querySelectorAll('input, select').forEach(el => {
            const key = el.id || el.name + '_' + el.value;
            if (el.type === 'checkbox' || el.type === 'radio') {
                data[key] = el.checked;
            } else {
                data[key] = el.value;
            }
        });
        localStorage.setItem('mapleCalcData_v15', JSON.stringify(data));
    }

    function loadData() {
        const saved = localStorage.getItem('mapleCalcData_v15');
        if (saved) {
            const data = JSON.parse(saved);
            document.querySelectorAll('input, select').forEach(el => {
                const key = el.id || el.name + '_' + el.value;
                if (data[key] !== undefined) {
                    if (el.type === 'checkbox' || el.type === 'radio') {
                        el.checked = data[key];
                    } else {
                        el.value = data[key];
                    }
                }
            });
        }
    }

    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const targetTheme = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', targetTheme);
        localStorage.setItem('m-theme', targetTheme);
        updateThemeEmoji(targetTheme);
    }

    function updateThemeEmoji(theme) {
        document.getElementById('themeBtn').innerText = theme === 'dark' ? '☀️' : '🌙';
    }

    document.getElementById('epiHigh').addEventListener('change', function() {
        if(this.checked) {
            document.getElementById('epiAng').checked = false;
            document.getElementById('epiNight').checked = false;
        }
        calculate();
    });
    document.getElementById('epiAng').addEventListener('change', function() {
        if(this.checked) {
            document.getElementById('epiHigh').checked = false;
            document.getElementById('epiNight').checked = false;
        }
        calculate();
    });
    document.getElementById('epiNight').addEventListener('change', function() {
        if(this.checked) {
            document.getElementById('epiHigh').checked = false;
            document.getElementById('epiAng').checked = false;
        }
        calculate();
    });

    document.querySelectorAll('input, select').forEach(i => {
        if(i.id !== 'penaltyStatus') {
            i.addEventListener('input', calculate);
            i.addEventListener('change', calculate);
        }
    });

    window.onload = () => {
        const savedTheme = localStorage.getItem('m-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeEmoji(savedTheme);
        
        loadData();
        if(!document.getElementById('expPerSec').value) {
            document.getElementById('expPerSec').value = "11E";
        }

        const savedLock = localStorage.getItem('maple_isLocked');
        if (savedLock === 'true') {
            isLocked = true;
        }
        updateLockUI();
        calculate();
    };
</script>

</body>
</html>
