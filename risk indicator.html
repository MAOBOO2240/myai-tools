<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark" data-size="medium">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股市估值指標與危險係數分析</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg-gradient: linear-gradient(225deg, #1A1C31, #10101B);
    --card-bg: rgba(30, 33, 58, 0.75);
    --card-border: rgba(255, 255, 255, 0.1);
    --text-primary: #FFFFFF;
    --text-secondary: #B0B5D0;
    --button-bg: #2D325A;
    --button-active: #4F5699;
    --font-base: 16px;
    --radius-g2: 24px; 
  }

  [data-theme="light"] {
    --bg-gradient: linear-gradient(225deg, #E6E9F0, #EEF1F5);
    --card-bg: rgba(255, 255, 255, 0.85);
    --card-border: rgba(0, 0, 0, 0.08);
    --text-primary: #1F2438;
    --text-secondary: #5A6282;
    --button-bg: #DCE1ED;
    --button-active: #9AA6CD;
  }

  [data-size="small"] { --font-base: 14px; }
  [data-size="medium"] { --font-base: 16px; }
  [data-size="large"] { --font-base: 19px; }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    min-height: 100vh;
    font-size: var(--font-base);
    background: var(--bg-gradient);
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
    overflow-x: hidden;
    position: relative;
    transition: background 0.3s ease;
  }

  .interactive-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(99, 102, 241, 0.15), transparent 80%);
  }

  ::-webkit-scrollbar { width: 12px; }
  ::-webkit-scrollbar-track { background: #10101B; border-radius: 12px; }
  ::-webkit-scrollbar-thumb { background: #2D325A; border-radius: 12px; border: 3px solid #10101B; }
  ::-webkit-scrollbar-thumb:hover { background: #4F5699; }

  .main-container {
    width: 66vw;
    min-width: 340px;
    max-width: 1200px;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
  }

  .gear-btn {
    position: fixed;
    top: 24px;
    right: 24px;
    background: transparent;
    border: none;
    padding: 0;
    font-size: 2.2rem;
    cursor: pointer;
    transition: transform 0.2s;
    z-index: 100;
  }
  .gear-btn:hover {
    transform: rotate(30deg);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: var(--radius-g2);
    padding: 0.66em 1.33em;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s ease;
    color: var(--text-primary);
    background: var(--button-bg);
  }
  .btn:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }
  .btn.active {
    background: #6366F1;
    color: #FFFFFF;
    box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
  }

  .macro-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-g2);
    padding: 16px 24px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .macro-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .macro-title {
    font-size: 1.3rem;
    font-weight: 700;
  }
  .macro-desc {
    color: var(--text-secondary);
    line-height: 1.5;
    font-size: 0.95rem;
  }

  .nav-tabs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .tab-btn {
    font-size: 0.9rem;
    padding: 0.5em 1em;
  }

  .content-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-g2);
    padding: 24px;
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .controls-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    background: rgba(0, 0, 0, 0.15);
    padding: 12px 16px;
    border-radius: var(--radius-g2);
  }

  .chart-container {
    position: relative;
    width: 100%;
    height: 380px;
  }

  .danger-badge {
    padding: 0.4em 0.8em;
    border-radius: var(--radius-g2);
    font-size: 0.85rem;
    font-weight: 700;
    color: #FFF;
  }

  .ai-report-box {
    background: rgba(0, 0, 0, 0.2);
    border-left: 4px solid #6366F1;
    padding: 16px;
    border-radius: 0 var(--radius-g2) var(--radius-g2) 0;
    font-size: 0.95rem;
    line-height: 1.6;
  }

  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }
  .modal-content {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-g2);
    padding: 28px;
    width: 360px;
    backdrop-filter: blur(20px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .modal-section { margin-bottom: 24px; }
  .modal-section h4 { margin-bottom: 12px; font-size: 1.1rem; }
  .btn-group { display: flex; gap: 12px; flex-wrap: wrap; }

  #toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 2000;
  }
  .toast {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text-primary);
    padding: 16px 24px;
    border-radius: var(--radius-g2);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    backdrop-filter: blur(16px);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transition: opacity 0.3s ease;
  }
  @keyframes slideIn {
    from { transform: translateX(120%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
</style>
</head>
<body>

<div id="toast-container"></div>
<div class="interactive-bg" id="bgEffect"></div>

<button class="gear-btn" id="gearBtn" title="設定">⚙️</button>

<main class="main-container">
  <header class="macro-card" id="macroContainer"></header>

  <nav class="nav-tabs" id="categoryTabs"></nav>

  <section class="content-card">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
      <h3 id="currentTitle" style="font-size:1.3rem;">📊 指標風險走勢</h3>
      <span class="danger-badge" id="currentBadge"></span>
    </div>
    <p id="currentDesc" style="color:var(--text-secondary); font-size:0.95rem;"></p>

    <!-- 控制列：開啟未來預測線 -->
    <div class="controls-bar">
      <button class="btn active" id="toggleForecastBtn">🔮 關閉風險預測線</button>
    </div>

    <div class="chart-container">
      <canvas id="riskChart"></canvas>
    </div>

    <!-- AI 評語詳細報告區塊 -->
    <div class="ai-report-box">
      <strong>🤖 AI 評語詳細報告：</strong>
      <p id="aiReportText" style="margin-top: 8px;"></p>
    </div>
  </section>
</main>

<div class="modal-overlay" id="settingsModal">
  <div class="modal-content">
    <h3 style="margin-bottom:20px;">⚙️ 偏好設定</h3>
    <div class="modal-section">
      <h4>主題模式</h4>
      <div class="btn-group">
        <button class="btn" id="btnThemeDark">🌙 深色</button>
        <button class="btn" id="btnThemeLight">☀️ 淺色</button>
      </div>
    </div>
    <div class="modal-section">
      <h4>文字大小</h4>
      <div class="btn-group">
        <button class="btn" id="btnSizeS">小</button>
        <button class="btn" id="btnSizeM">中</button>
        <button class="btn" id="btnSizeL">大</button>
      </div>
    </div>
    <button class="btn" id="closeModalBtn" style="width:100%; margin-top:12px;">關閉設定</button>
  </div>
</div>

<script>

const DATES_ALL = [
  "8/01", "8/02", "8/03", "8/04", "8/05", "8/06", "8/07", "8/08", "8/09", "8/10", "8/11", "8/12", "8/13", "8/14",
  "8/15", "8/16", "8/17", "8/18", "8/19", "8/20", "8/21"
];

let currentCategoryIndex = 0;
let showForecast = true; 
let chartInstance = null;

function renderMacro() {
  const container = document.getElementById('macroContainer');
  container.innerHTML = `
    <div class="macro-header">
      <h2 class="macro-title">${MACRO_JUDGMENT.title}</h2>
      <span class="danger-badge" style="background-color: ${MACRO_JUDGMENT.badgeColor}">即時監測</span>
    </div>
    <p class="macro-desc">${MACRO_JUDGMENT.description}</p>
  `;
}

function renderTabs() {
  const container = document.getElementById('categoryTabs');
  container.innerHTML = INDICATORS_DATA.map((item, index) => `
    <button class="btn tab-btn ${index === currentCategoryIndex ? 'active' : ''}" onclick="switchTab(${index})">
      ${item.emoji} ${item.name}
    </button>
  `).join('');
}

function switchTab(index) {
  currentCategoryIndex = index;
  renderTabs();
  updateTabContent();
}

function updateTabContent() {
  const data = INDICATORS_DATA[currentCategoryIndex];
  document.getElementById('currentTitle').innerText = `${data.emoji} ${data.name} Risk Trend (最新數值: ${data.value})`;
  document.getElementById('currentBadge').innerText = data.dangerLevel;
  document.getElementById('currentBadge').style.backgroundColor = data.dangerColor;
  document.getElementById('currentDesc').innerText = data.desc;
  document.getElementById('aiReportText').innerText = data.report;

  renderChart();
}

function renderChart() {
  const ctx = document.getElementById('riskChart').getContext('2d');
  const data = INDICATORS_DATA[currentCategoryIndex];

  const historyDataAligned = [...data.history, ...Array(DATES_ALL.length - data.history.length).fill(null)];

  if (chartInstance) {
    chartInstance.destroy();
  }

  const datasets = [
    {
      label: '歷史風險係數 (%)',
      data: historyDataAligned,
      borderColor: '#6366F1',
      backgroundColor: 'rgba(99, 102, 241, 0.15)',
      fill: true,
      tension: 0.3,
      borderWidth: 3,
      pointRadius: 4,
      pointHoverRadius: 6,
      zIndex: 2
    }
  ];

  if (showForecast) {
    datasets.push({
      label: '預測模型與未來風險線 (%)',
      data: data.forecast,
      borderColor: '#FF5500',
      borderDash: [6, 6], 
      backgroundColor: 'transparent',
      fill: false,
      tension: 0.3,
      borderWidth: 2,
      pointRadius: 3,
      pointHoverRadius: 5,
      zIndex: 1
    });
  }

  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: DATES_ALL,
      datasets: datasets
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false
      },
      plugins: {
        legend: {
          labels: { color: '#B0B5D0', font: { size: 13 } }
        },
        tooltip: {
          mode: 'index',
          intersect: false
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(255, 255, 255, 0.05)' },
          ticks: { color: '#B0B5D0' }
        },
        y: {
          min: 40,
          max: 100,
          grid: { color: 'rgba(255, 255, 255, 0.05)' },
          ticks: { color: '#B0B5D0' }
        }
      }
    }
  });
}

function autoUpdateDatabase() {
  showToast('網站載入完成，數據庫已自動更新至最新狀態。', '🔄');
}

const toggleForecastBtn = document.getElementById('toggleForecastBtn');
toggleForecastBtn.addEventListener('click', () => {
  showForecast = !showForecast;
  toggleForecastBtn.classList.toggle('active', showForecast);
  toggleForecastBtn.innerText = showForecast ? '🔮 關閉風險預測線' : '🔮 開啟風險預測線';
  renderChart();
  showToast(showForecast ? '已顯示完整預測模型比較與未來趨勢' : '已隱藏風險預測線');
});

let ticking = false;
document.addEventListener('mousemove', (e) => {
  if (!ticking) {
    window.requestAnimationFrame(() => {
      const bg = document.getElementById('bgEffect');
      const x = (e.clientX / window.innerWidth) * 100;
      const y = (e.clientY / window.innerHeight) * 100;
      bg.style.setProperty('--mouse-x', `${x}%`);
      bg.style.setProperty('--mouse-y', `${y}%`);
      ticking = false;
    });
    ticking = true;
  }
});

const modal = document.getElementById('settingsModal');
document.getElementById('gearBtn').addEventListener('click', () => modal.style.display = 'flex');
document.getElementById('closeModalBtn').addEventListener('click', () => modal.style.display = 'none');
modal.addEventListener('click', (e) => { if(e.target === modal) modal.style.display = 'none'; });

const htmlEl = document.documentElement;
const btnDark = document.getElementById('btnThemeDark');
const btnLight = document.getElementById('btnThemeLight');
function setTheme(theme) {
  htmlEl.setAttribute('data-theme', theme);
  btnDark.classList.toggle('active', theme === 'dark');
  btnLight.classList.toggle('active', theme === 'light');
}
btnDark.addEventListener('click', () => setTheme('dark'));
btnLight.addEventListener('click', () => setTheme('light'));
setTheme('dark');

const btnS = document.getElementById('btnSizeS');
const btnM = document.getElementById('btnSizeM');
const btnL = document.getElementById('btnSizeL');
function setFontSize(size) {
  htmlEl.setAttribute('data-size', size);
  btnS.classList.toggle('active', size === 'small');
  btnM.classList.toggle('active', size === 'medium');
  btnL.classList.toggle('active', size === 'large');
}
btnS.addEventListener('click', () => setFontSize('small'));
btnM.addEventListener('click', () => setFontSize('medium'));
btnL.addEventListener('click', () => setFontSize('large'));
setFontSize('medium');

function showToast(message, icon = '✨') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

renderMacro();
renderTabs();
updateTabContent();
autoUpdateDatabase();
</script>
